name: Verify WAKA

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: waka-verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sources-and-server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '21'
      - name: Prepare retained Maven from the official Apache archive
        run: |
          curl -fsSLo "$RUNNER_TEMP/maven.tar.gz" https://archive.apache.org/dist/maven/maven-3/3.10.0/binaries/apache-maven-3.10.0-bin.tar.gz
          echo "908b1501bfb420bf7c8affb855534a9c407fd6099367bfb9f2f2dcb8e9799102bffb84518cde74c679bd76870247c6528683abdd620581bffa90f95d92d175aa  $RUNNER_TEMP/maven.tar.gz" | sha512sum --check
          tar -xzf "$RUNNER_TEMP/maven.tar.gz" -C "$RUNNER_TEMP"
      - name: Verify source boundaries
        run: python tools/check_sources.py
      - name: Compile and test server without external services
        working-directory: backend
        run: '"$RUNNER_TEMP/apache-maven-3.10.0/bin/mvn" -B -ntp -C -s .mvn/settings.xml -gs .mvn/settings.xml verify'

  flutter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Prepare the retained Flutter version from the official repository
        run: git clone --branch 3.47.6 --depth 1 https://github.com/flutter/flutter.git "$RUNNER_TEMP/flutter"
      - name: Analyze and test mobile
        working-directory: apps/mobile
        run: |
          export PATH="$RUNNER_TEMP/flutter/bin:$PATH"
          flutter config --no-analytics
          flutter pub get --enforce-lockfile
          dart format --output=none --set-exit-if-changed lib test
          flutter analyze --no-pub
          flutter test --no-pub
