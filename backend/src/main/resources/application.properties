spring.application.name=waka-backend

# Acces local par defaut ; le port peut etre surcharge sans modifier ce fichier.
server.address=127.0.0.1
server.port=${WAKA_SERVER_PORT:8080}

# Administration web separee : origines autorisees listees explicitement, aucune par defaut.
waka.admin-web.allowed-origins=${WAKA_ADMIN_WEB_ORIGINS:}

# Aucun profil par defaut ; dev ou test doit etre choisi explicitement.
spring.main.lazy-initialization=false
spring.main.banner-mode=off
spring.main.log-startup-info=false
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.hikari.connection-timeout=5000
spring.datasource.hikari.validation-timeout=3000
spring.datasource.hikari.maximum-pool-size=3
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.data-source-properties.connectionTimeZone=UTC
spring.datasource.hikari.data-source-properties.forceConnectionTimeZoneToSession=true
spring.jdbc.template.query-timeout=3s

# Flyway est l'unique gestionnaire du schema ; aucune creation SQL ou Hibernate cachee.
spring.sql.init.mode=never
spring.jpa.hibernate.ddl-auto=none
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.create-schemas=false
spring.flyway.baseline-on-migrate=false
spring.flyway.clean-disabled=true
spring.flyway.validate-on-migrate=true

# Les erreurs HTTP ne doivent pas exposer les details internes de l'application.
spring.web.error.include-message=never
spring.web.error.include-binding-errors=never
spring.web.error.include-stacktrace=never
spring.web.error.include-exception=false
spring.web.error.include-path=never
spring.mvc.log-request-details=false
server.tomcat.accesslog.enabled=false
